<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PBL Trainer</title>
    <link rel="stylesheet" href="css/index.css" />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&display=swap" rel="stylesheet" />




    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
</head>

<body>
    <svg aria-hidden="true" style="display:none">
        <symbol id="rail-icon-cases" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
        <symbol id="rail-icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
        <symbol id="rail-icon-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7"/><line x1="12" y1="17" x2="12" y2="17"/></symbol>
        <symbol id="rail-icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15z"/></symbol>
        <symbol id="icon-lightbulb" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8.5 14.5c-1.6-1.1-2.5-2.9-2.5-4.8A6 6 0 0 1 18 9.7c0 1.9-.9 3.7-2.5 4.8-.6.4-.9 1-.9 1.7V17H9.4v-.8c0-.7-.3-1.3-.9-1.7z"/></symbol>
        <symbol id="icon-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
        <symbol id="rail-icon-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
        <symbol id="rail-icon-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    </svg>
    <div class="navbar">
        <div class="nav-left">
            <span class="squango" id="squango-home" data-tip="Return to SquanGo home page"><span class="squango-sq">Squan</span><span class="squango-go">Go</span></span>
        </div>
        <div class="nav-center" id="mode-title" data-tip="Switch to OBL Trainer" style="cursor:pointer;user-select:none;">
            <button class="mode-arrow" id="mode-arrow" type="button" aria-label="Switch trainer" tabindex="-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <span class="mode-title-text" id="mode-title-text"></span>
        </div>
        <div class="nav-spacer"></div>
    </div>
    <input type="file" id="fileinput" style="display: none" accept=".json" />

    <div id="search-overlay" class="search-overlay" style="display:none;">
        <div class="search-panel">
            <div class="search-bar">
                <svg class="search-bar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search clusters…" autocomplete="off" spellcheck="false" />
                <button id="search-help-btn" class="search-help-btn" data-tip="Search help" aria-label="Search help">?</button>
            </div>
            <div id="search-extension" class="search-extension" style="display:none;">
                <div id="search-heatmaps" class="search-heatmaps" style="display:none;"></div>
                <div id="search-results" class="search-results"></div>
                <div id="search-cluster" class="search-cluster" style="display:none;">
                    <div id="search-cluster-toolbar" class="search-cluster-toolbar">
                        <button class="sct-btn sct-back" data-tip="Back" aria-label="Back">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <button class="sct-btn sct-edit" data-tip="Edit alg reference" aria-label="Edit">
                            <svg class="sct-pencil-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                            <svg class="sct-edit-back-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <button class="sct-btn sct-save" data-tip="Save changes" aria-label="Save changes" style="display:none;" disabled>
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                        </button>
                        <button class="sct-btn sct-undo" data-tip="Undo" aria-label="Undo" style="display:none;">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a6 6 0 0 1 0 12h-4"/></svg>
                        </button>
                        <button class="sct-btn sct-redo" data-tip="Redo" aria-label="Redo" style="display:none;">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a6 6 0 0 0 0 12h4"/></svg>
                        </button>
                    </div>
                    <div id="search-cluster-content" class="cluster-text"></div>
                </div>
                <div id="search-tagview" class="search-tagview" style="display:none;"></div>
                <div id="search-listview" class="search-listview" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div id="search-help-modal" class="search-help-overlay" style="display:none;">
        <div class="search-help-window">
            <div class="search-help-header">
                <span class="search-help-title" id="search-help-title">Search</span>
                <button class="cluster-close-btn" id="search-help-close">✕</button>
            </div>
            <div id="search-help-content" class="search-help-content"></div>
        </div>
    </div>

    <div id="tag-modal" class="tag-overlay" style="display:none;">
        <div class="tag-window">
            <div class="tag-header">
                <span class="tag-window-title">Tags</span>
                <button class="cluster-close-btn" id="tag-modal-close">✕</button>
            </div>
            <div id="tag-list" class="tag-list"></div>
            <div class="tag-footer">
                <button id="tag-add-btn" class="tag-add-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add tag
                </button>
            </div>
        </div>
    </div>

    <div class="main">
        <nav class="rail collapsed hidden-mobile" id="rail">
            <button class="rail-toggle" id="rail-toggle" data-tip="Expand" aria-label="Toggle sidebar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
            </button>
            <div class="rail-actions" id="rail-actions">
                <button class="rail-btn" data-action="cases" data-tip="Select cases" aria-label="Case selector"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-cases"/></svg></span><span class="rail-btn-label">Case selector</span></button>
                <button class="rail-btn" data-action="search" data-tip="Search (Ctrl+Space)" aria-label="Search"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-search"/></svg></span><span class="rail-btn-label">Search</span></button>
                <button class="rail-btn" data-action="help" data-tip="How to use" aria-label="How to use"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-help"/></svg></span><span class="rail-btn-label">How to use</span></button>
                <button class="rail-btn" data-action="settings" data-tip="Settings" aria-label="Settings"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-settings"/></svg></span><span class="rail-btn-label">Settings</span></button>
            </div>
            <div class="rail-extra" id="rail-extra">
                <button class="rail-btn" data-action="upload" data-tip="Upload data" aria-label="Upload data"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-upload"/></svg></span><span class="rail-btn-label">Upload data</span></button>
                <button class="rail-btn" data-action="download" data-tip="Download data" aria-label="Download data"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-download"/></svg></span><span class="rail-btn-label">Download data</span></button>
            </div>
        </nav>

        <div class="popup" id="cases-popup">
            <div class="popup-inner cases-popup-inner">
                <div class="list-bar">
                    <div class="list-name" id="selcount">Selected: -</div>
                    <div class="cross">&#10005;</div>
                </div>
                <div class="cases-body" id="sidebar">
                    <div class="barflip-override-row hidden" id="barflip-override-row">
                        <span class="barflip-override-label">Global barflip override:</span>
                        <div class="barflip-toggle">
                            <button class="barflip-toggle-btn" id="barflip-flipped">Flipped</button>
                            <div class="barflip-sep"></div>
                            <button class="barflip-toggle-btn" id="barflip-solved">Solved</button>
                        </div>
                    </div>
                    <input type="text" class="filter-input" id="pbl-filter" maxlength="25" autocomplete="new-pbl-filter"
                        placeholder='Filter cases (Ctrl+F)' />
                    <div class="selection-grid">
                        <button class="selection-btn" id="sela">Select ALL</button>
                        <button class="selection-btn" id="desela">Deselect ALL</button>
                        <button class="selection-btn" id="showtoggle">Showing: all</button>
                        <button class="selection-btn" id="openlists">Select list</button>
                    </div>
                    <div class="pbl-grid" id="results">
                        <!-- Cases -->
                    </div>
                </div>
            </div>
        </div>

        <div class="popup" id="settings-popup">
            <div class="popup-inner settings-popup-inner">
                <div class="list-bar">
                    <div class="list-name">Settings</div>
                    <div class="cross">&#10005;</div>
                </div>
                <div class="settings-body">
                    <label class="settings-row settings-checkbox">
                        <input type="checkbox" id="each-case" />
                        <span>Train each case once <b>(E)</b><span id="each-case-remaining" style="display:none;"> — <span id="remaining-count" style="color:#96dae7;font-weight:bold;">0</span> left</span></span>
                    </label>
                    <label class="settings-row settings-checkbox">
                        <input type="checkbox" id="karn" />
                        <span>Use karnotation <b>(K)</b></span>
                    </label>
                    <label class="settings-row settings-checkbox">
                        <input type="checkbox" id="weight" />
                        <span>Use realistic weights <b>(R)</b></span>
                    </label>
                    <label class="settings-row settings-checkbox">
                        <input type="checkbox" id="usebarflip" />
                        <span>Distinguish between + and - barflip <b>(B)</b></span>
                    </label>
                    <label class="settings-row settings-checkbox" id="countbarflip-row">
                        <input type="checkbox" id="countbarflip" />
                        <span>Count + and - as 2 cases <b>(C)</b></span>
                    </label>
                    <label class="settings-row settings-checkbox" id="globalbarfliprow">
                        <input type="checkbox" id="globalbarflip" />
                        <span>Show global barflip override <b>(G)</b></span>
                    </label>
                    <label class="settings-row settings-checkbox" id="bottom56-row" style="display:none">
                        <input type="checkbox" id="allow-bottom56" />
                        <span>Allow bottom 5s and 6s</span>
                    </label>
                    <label class="settings-row settings-checkbox" id="specific-row">
                        <input type="checkbox" id="specific" />
                        <span>Use specific case naming <b>(S)</b></span>
                    </label>
                    <label class="settings-row settings-checkbox" id="oblp-row">
                        <input type="checkbox" id="oblp" />
                        <span>Show Matt tracing memo <b>(P)</b></span>
                    </label>
                    <label class="settings-row settings-checkbox">
                        <input type="checkbox" id="hide-hint-btn" />
                        <span>Hide hint button <b>(H)</b></span>
                    </label>
                    <div class="settings-row" id="obl-naming-row">
                        <span>OBL naming:</span>
                        <button class="settings-cycle-btn" id="obl-naming-toggle" type="button">Matt's naming</button>
                    </div>
                    <div class="settings-row" id="pbl-ref-row">
                        <span>Default PBL reference:</span>
                        <button class="settings-cycle-btn" id="pbl-ref-toggle" type="button">Matt</button>
                    </div>
                    <div class="settings-row" id="obl-ref-row">
                        <span>Default OBL reference:</span>
                        <button class="settings-cycle-btn" id="obl-ref-toggle" type="button">Matt</button>
                    </div>
                    <div class="settings-row" id="scramble-length-row">
                        <span>Scramble length:</span>
                        <div class="equator-options">
                            <label><input type="radio" name="scramlen" value="long" checked /> Long</label>
                            <label><input type="radio" name="scramlen" value="medium" /> Medium</label>
                            <label><input type="radio" name="scramlen" value="short" /> Short</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="popup" id="list-popup">
            <div class="popup-inner list-popup-inner">
                <div class="list-bar">
                    <div class="list-name">Manage lists</div>
                    <div class="cross">&#10005;</div>
                </div>
                <div class="list-menu" id="list-menu">
                    <div class="sublist-name">Default lists</div>
                    <div id="defaultlists" class="sublist-menu"></div>
                    <div class="sublist-name">Your lists</div>
                    <div id="userlists" class="sublist-menu"></div>
                    <div class="sublist-name">Your tags</div>
                    <div id="usertags" class="sublist-menu"></div>
                </div>
                <div class="list-buttons">
                    <div class="list-btn-group">
                        <button class="list-btn" id="dellist">Delete</button>
                        <button class="list-btn" id="overwritelist">Overwrite</button>
                    </div>
                    <div class="list-btn-group list-btn-group-right">
                        <button class="list-btn" id="sellist">View</button>
                        <button class="list-btn" id="trainlist">Select</button>
                        <button class="list-btn" id="newlist">New List</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="popup" id="help-popup">
            <div class="popup-inner help-popup-inner">
                <div class="list-bar">
                    <div class="list-name">Help</div>
                    <div class="cross">&#10005;</div>
                </div>
                <div class="help-layout">
                    <nav class="help-nav" id="help-nav"></nav>
                    <div class="help-content" id="help-content"></div>
                </div>
            </div>
        </div>

        <div class="popup" id="hint-popup">
            <div class="popup-inner hint-popup-inner">
                <div class="list-bar">
                    <div class="list-name" id="hint-title">Hint</div>
                    <button class="cluster-close-btn hint-edit-btn" id="hint-edit" data-tip="Edit comment" aria-label="Edit comment">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-pen"/></svg>
                    </button>
                    <div class="cross">&#10005;</div>
                </div>
                <div class="hint-body" id="hint-body"></div>
            </div>
        </div>

        <div class="content" id="content">
            <div class="top-bar">
                <div class="scramble-row">
                    <div class="bar-scramble" id="cur-scram">
                        Scramble will show up here
                    </div>
                </div>
                <div class="scramble-controls">
                    <button class="bar-btn" id="prev" disabled>← Previous</button>
                            <button class="bar-btn" id="unselprev">
                                Remove last
                            </button>
                            <button class="bar-btn" id="next">Next →</button>
                            <button class="hint-btn" id="hint-btn" data-tip="Show hint" aria-label="Show hint">
                                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-lightbulb"/></svg>
                            </button>
                </div>
            </div>

            <div class="timer-box" id="timerbox">
                <div class="timer-display" id="timer">--:--</div>
            </div>

            <div class="bottom-bar">
                <div class="bar-scramble" id="prev-scram" style="cursor:pointer;">
                    Last scramble will show up here
                </div>
            </div>
        </div>
    </div>
    <nav class="mobilebar" id="mobilebar">
        <button class="rail-btn" data-action="cases" data-tip="Select cases" aria-label="Case selector"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-cases"/></svg></span></button>
        <button class="rail-btn" data-action="search" data-tip="Search (Ctrl+Space)" aria-label="Search"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-search"/></svg></span></button>
        <button class="rail-btn" data-action="help" data-tip="How to use" aria-label="How to use"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-help"/></svg></span></button>
        <button class="rail-btn" data-action="settings" data-tip="Settings" aria-label="Settings"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-settings"/></svg></span></button>
        <button class="rail-btn" data-action="upload" data-tip="Upload data" aria-label="Upload data"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-upload"/></svg></span></button>
        <button class="rail-btn" data-action="download" data-tip="Download data" aria-label="Download data"><span class="rail-btn-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#rail-icon-download"/></svg></span></button>
    </nav>
    <div id="success-toast" class="success-toast" style="display:none;">
        <div class="success-box" id="toast-box">
            <span class="success-icon" id="toast-icon"></span>
            <span class="success-message" id="success-message">Done!</span>
        </div>
    </div>
</body>

    <script type="module" src="script/main.js"></script>

</html>
